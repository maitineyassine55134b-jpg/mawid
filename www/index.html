<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mawid</title>
<meta name="theme-color" content="#0B2A5B">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="jspdf.umd.min.js"></script>
<style>
:root{--nuit:#0B2A5B;--turq:#1FB5A3;--corail:#F2694B;--ciel:#E4F1FA;--bg:#F7FAFC;--surface:#FFFFFF;--text:#0B2A5B;--muted:#4A5B73;--line:#D9E4EE;--accent:#0A7A6D;--danger:#C2462A;--on-danger:#fff;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1F40;--surface:#132B52;--text:#F7FAFC;--muted:#A9B9CF;--ciel:#1A3660;--line:#24406B;--accent:#1FB5A3;--danger:#FF8A70;--on-danger:#0B2A5B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1F40;--surface:#132B52;--text:#F7FAFC;--muted:#A9B9CF;--ciel:#1A3660;--line:#24406B;--accent:#1FB5A3;--danger:#FF8A70;--on-danger:#0B2A5B;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:16px}
h1,.brand,.btn,.btn-s{font-family:Poppins,Inter,system-ui,sans-serif}
.app{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--nuit);color:#F7FAFC;padding:16px 20px;display:flex;align-items:center;gap:10px;background-image:radial-gradient(rgba(31,181,163,.22) 1.5px,transparent 1.6px);background-size:22px 22px}
header .brand{font-weight:700;font-size:22px;letter-spacing:-.3px}
header .sp{flex:1}
main{flex:1;padding:20px 20px 110px}
h1{font-size:24px;margin:6px 0 6px}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:flex-start}
.grow{flex:1;min-width:0}
.meta{color:var(--muted);font-size:14px;margin:2px 0 0}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font:400 16px Inter,sans-serif}
input:focus{outline:none;border-color:var(--turq)}
select,textarea{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font:400 16px Inter,sans-serif}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.chip{border:1.5px solid var(--turq);background:var(--surface);color:var(--text);border-radius:999px;padding:8px 14px;font:600 13px Inter,sans-serif;cursor:pointer}
.chip.on{background:var(--turq);color:var(--nuit)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.slot{padding:10px 4px;border-radius:12px;border:1.5px solid var(--turq);background:var(--surface);color:var(--text);font:600 14px Inter,sans-serif;cursor:pointer}
.slot:disabled{border-color:var(--line);color:var(--muted);text-decoration:line-through;cursor:default}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.opt{padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font:600 15px Inter,sans-serif;text-align:left;cursor:pointer}
.opt.on{border-color:var(--turq);background:var(--ciel)}
.rr{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.rr:last-child{border-bottom:0}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.link.danger{color:var(--danger)}
.btn-s.danger{background:var(--danger);color:var(--on-danger)}
.btn.sec{background:transparent;color:var(--text);border:1.5px solid var(--line)}
h2{font-size:18px;font-family:Poppins,Inter,sans-serif;margin:18px 0 10px}
.btn,.btn-s{border:0;cursor:pointer;font-weight:600;background:var(--turq);color:var(--nuit)}
.btn{width:100%;margin-top:16px;padding:14px;border-radius:999px;font-size:16px}
.btn-s{margin-top:12px;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--ciel);border-radius:999px;padding:4px;margin-bottom:16px}
.seg button{border:0;background:none;padding:10px;border-radius:999px;font:600 14px Inter,sans-serif;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(11,42,91,.15)}
.social{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.social button{padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font:600 15px Inter,sans-serif;cursor:pointer}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:18px 0 12px}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--danger);font-size:14px;margin-top:10px;min-height:18px}
.hint{background:var(--ciel);color:var(--text);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}
.link{background:none;border:0;color:var(--accent);font:600 14px Inter,sans-serif;cursor:pointer;padding:0}
.ico{width:40px;height:40px;border-radius:12px;background:var(--ciel);display:grid;place-items:center;flex:none;color:var(--accent)}
.badge{font:600 12px Inter,sans-serif;padding:4px 10px;border-radius:999px;white-space:nowrap}
.b-ok{background:rgba(31,181,163,.18);color:var(--accent)}
.b-past{background:var(--ciel);color:var(--muted)}
.b-cancel{background:rgba(242,105,75,.16);color:var(--danger)}
.unread{width:8px;height:8px;border-radius:50%;background:var(--corail);flex:none;margin-top:8px}
.count{background:var(--corail);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px;margin-left:4px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav button{border:0;background:none;color:var(--muted);font:600 13px Inter,sans-serif;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button.on{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--nuit);color:#F7FAFC;padding:12px 16px;border-radius:12px;font-size:14px;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.toast.show{opacity:1}
.app{max-width:none}
main{width:100%;max-width:1100px;margin:0 auto;padding:22px 18px 110px}
main.au{max-width:480px;padding-bottom:40px}
main>.card,main>.hint,main>.btn,main>.sub,main>.empty,main>.meta,main>.acct{max-width:640px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px}
.btn.dng{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn.dfill{background:var(--danger);color:var(--on-danger)}
.actions .btn{width:auto;margin:0;padding:12px 20px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--turq);outline-offset:2px}
nav{left:0;transform:none;max-width:none;display:block;padding:0}
.ni{display:grid;grid-template-columns:repeat(5,1fr);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.sb{display:none}
.av{width:40px;height:40px;border-radius:50%;border:0;background:var(--turq);color:var(--nuit);font:700 14px Poppins,sans-serif;display:grid;place-items:center;flex:none;cursor:pointer}
.av.sm{width:30px;height:30px;font-size:12px;cursor:inherit}
.pb{display:flex;align-items:center;gap:10px;width:100%;max-width:640px;margin:0 0 14px;padding:8px 12px;border-radius:14px;border:1px solid var(--line);background:var(--ciel);color:var(--text);font:14px Inter,sans-serif;text-align:left;cursor:pointer}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.grid>.card{margin:0}
.cols{display:grid;gap:0 28px;grid-template-columns:minmax(0,1fr)}
.slots{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
.seg{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr;max-width:480px}
.seg button{display:flex;gap:6px;align-items:center;justify-content:center}
.srow{display:flex;gap:10px;max-width:640px}
.pcard{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.pcard.on{border-color:var(--turq);background:var(--ciel)}
.pmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.cf{flex-basis:100%;display:flex;gap:12px;align-items:center}
.cf .btn-s{margin:0}
.acct{display:grid;gap:10px}
.catbar{display:flex;align-items:center;gap:8px;margin:6px 0 14px}
.cats{position:relative;display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scroll-snap-type:x proximity;scrollbar-width:none;padding:4px 14px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.cats::-webkit-scrollbar{display:none}
.cats .chip{flex:none;scroll-snap-align:center;white-space:nowrap}
.arr{display:none;flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;place-items:center}
@media (hover:hover) and (pointer:fine){.arr{display:grid}}
@media (min-width:600px){main{padding:28px 32px 120px}}
@media (min-width:900px){.app.in{padding-left:248px}header.mh{display:none}nav{top:0;right:auto;width:248px;border-top:0;background:var(--nuit);padding:22px 14px}.sb{display:flex;align-items:center;gap:10px;color:#F7FAFC;font:700 24px Poppins,sans-serif;padding:4px 10px 26px}.ni{display:flex;flex-direction:column;gap:4px;padding:0}nav button{flex-direction:row;gap:12px;font-size:15px;padding:12px 14px;border-radius:12px;color:rgba(247,250,252,.8);justify-content:flex-start}nav button.on{background:rgba(255,255,255,.1);color:var(--turq)}main{padding:36px 44px 56px}main.au{margin-top:4vh}.cols{grid-template-columns:1fr 1fr;align-items:start}.toast{bottom:28px}.acct{grid-template-columns:1fr 1fr}}
.av{background-size:cover;background-position:center}.av.lgph{width:84px;height:84px;font-size:28px;cursor:inherit}
.dph{width:52px;height:52px;border-radius:14px;flex:none;object-fit:cover}.dph.big{width:76px;height:76px;border-radius:18px}
.mh .lg{background:none;border:0;color:inherit;cursor:pointer;display:flex;align-items:center;gap:10px;padding:0;font:inherit}.sb{background:none;border:0;cursor:pointer}
.lb{background:none;border:1px solid rgba(247,250,252,.35);color:#F7FAFC;border-radius:999px;padding:4px 10px;font:600 12px Inter,sans-serif;cursor:pointer;margin-inline-start:6px}.lb.on{background:var(--turq);color:var(--nuit);border-color:var(--turq)}
[dir=rtl] .pb,[dir=rtl] .pmain,[dir=rtl] .opt,[dir=rtl] .cats{text-align:right}
@media (min-width:900px){[dir=rtl] .app.in{padding-left:0;padding-right:248px}[dir=rtl] nav{left:auto;right:0;border-right:0;border-left:1px solid var(--line)}}
.heart{background:none;border:0;cursor:pointer;color:var(--muted);padding:6px;flex:none;align-self:flex-start}.heart.on{color:var(--corail)}.heart.on svg{fill:var(--corail)}
.dl{margin:6px 0 0;padding-inline-start:18px;color:var(--muted);font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<script>
const LOGO=`<svg width="40" height="40" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="11" fill="#0B2A5B"/><rect x="9" y="11" width="30" height="27" rx="5" fill="#F7FAFC"/><rect x="9" y="11" width="30" height="9" rx="5" fill="#1FB5A3"/><rect x="15" y="7" width="3.5" height="8" rx="1.75" fill="#F7FAFC"/><rect x="29.5" y="7" width="3.5" height="8" rx="1.75" fill="#F7FAFC"/><path d="M24 24v9M19.5 28.5h9" stroke="#0B2A5B" stroke-width="3.6" stroke-linecap="round"/><circle cx="35" cy="34" r="7" fill="#1FB5A3" stroke="#0B2A5B" stroke-width="2.5"/><path d="M31.6 34.2l2.3 2.3 4.6-4.8" fill="none" stroke="#0B2A5B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ICON={cal:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M9 15l2 2 4-4"/>',bell:'<path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/>',check:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',dl:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',out:'<path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/>',home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',auto:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',cl:'<path d="M15 5l-7 7 7 7"/>',cr:'<path d="M9 5l7 7-7 7"/>'};
const svg=(k,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;
const STATUS={'confirmé':'Confirmé','passé':'Effectué','annulé':'Annulé'};
const BADGE={'confirmé':'b-ok','passé':'b-past','annulé':'b-cancel'};
const NOTIF_ICON={welcome:'check',confirm:'check',reminder:'clock',receipt:'dl'};
const DOCTORS=[{name:'Dr. Sara El Amrani',spec:'Médecine générale',hop:'Centre hospitalier Ibn Sina'},{name:'Dr. Yassine Benali',spec:'Cardiologie',hop:'Hôpital provincial'},{name:'Dr. Leila Mansouri',spec:'Pédiatrie',hop:'Centre hospitalier Ibn Sina'}];

const KEY_USERS='mawid_users',KEY_DATA='mawid_data',KEY_SESS='mawid_session';
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=iso=>new Date(iso).toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fmtTime=iso=>new Date(iso).toLocaleTimeString(LOC,{hour:'2-digit',minute:'2-digit'});
const fmtDT=iso=>`${fmtDate(iso)} · ${fmtTime(iso)}`;
const normPhone=s=>String(s).replace(/[\s.\-()]/g,'');
const validPhone=p=>/^\+?\d{9,15}$/.test(p);

const KEY_PREF='mawid_pref';
let pref=Object.assign({theme:'auto',lang:'fr'},load(KEY_PREF,{}));
var LOC='fr-FR';function applyPref(){const r=document.documentElement;const l=pref.lang||'fr';LOC={fr:'fr-FR',en:'en-GB',ar:'ar-MA'}[l];r.lang=l;r.dir=l==='ar'?'rtl':'ltr';pref.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',pref.theme)}
applyPref();
let users=load(KEY_USERS,[]);
let data=load(KEY_DATA,{});
let session=load(KEY_SESS,null);
let me=users.find(u=>u.id===session)||null;
let view='home';
let auth={mode:'login',method:'email',step:1,phone:'',firstName:'',lastName:'',demoCode:''};
const app=document.getElementById('app');
let downloads=null;
if(window.claude&&window.claude.use){window.claude.use('downloads').then(d=>{downloads=d}).catch(()=>{})}

function seed(){
  const now=Date.now(),day=86400000;
  const at=(o,h,m)=>{const x=new Date(now+o*day);x.setHours(h,m,0,0);return x.toISOString()};
  const appts=[
    {id:'MW-2610-0412',doc:DOCTORS[0],date:at(-7,9,30),status:'passé',motif:'Consultation générale',price:200},
    {id:'MW-2610-0455',doc:DOCTORS[1],date:at(4,10,0),status:'confirmé',motif:'Consultation cardiologie',price:300},
    {id:'MW-2610-0391',doc:DOCTORS[2],date:at(-20,11,0),status:'annulé',motif:'Consultation pédiatrie',price:250}];
  const n=(type,title,body,date,read)=>({id:uid(),type,title,body,date,read});
  const notifs=[
    n('welcome','Bienvenue sur Mawid','Votre compte est prêt. Réservez en 2 minutes.',new Date(now).toISOString(),false),
    n('confirm','Rendez-vous confirmé',`${appts[1].doc.name} · ${fmtDT(appts[1].date)}`,at(-1,9,0),false),
    n('reminder','Rappel par SMS',`Votre rendez-vous est prévu le ${fmtDate(appts[1].date)}.`,at(-2,18,0),true),
    n('receipt','Reçu disponible',`Le reçu de votre consultation du ${fmtDate(appts[0].date)} est prêt en PDF.`,at(-6,12,0),true)];
  return {appts,notifs};
}
function ensureData(id){if(!data[id]){data[id]=seed();save(KEY_DATA,data)}}
function createAccount(o){
  const u={id:uid(),provider:'email',email:'',phone:'',password:'',...o};
  users.push(u);save(KEY_USERS,users);ensureData(u.id);return u;
}
function signIn(u){
  me=u;session=u.id;save(KEY_SESS,u.id);view='home';
  auth={...auth,step:1,demoCode:'',phone:''};
  render();toast(`Bienvenue, ${u.firstName} !`);
}
function signOut(){me=null;session=null;save(KEY_SESS,null);auth.step=1;view='home';bk=null;profEdit=profAdd=accDel=false;delProf=null;render()}
function social(p){
  const profiles={google:{firstName:'Youssef',lastName:'El Amrani',email:'youssef.elamrani@gmail.com'},apple:{firstName:'Salma',lastName:'Benjelloun',email:'salma.b@icloud.com'}};
  const pr=profiles[p];
  let u=users.find(x=>x.provider===p&&x.email===pr.email);
  if(!u)u=createAccount({...pr,provider:p});
  signIn(u);
}

let tt;
function toast(m){const t=document.getElementById('toast');t.textContent=tr(m);t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2800)}
const errEl=m=>{const e=document.getElementById('err');if(e)e.textContent=tr(m)};

function emailForm(s){
  return `<form data-form="email" novalidate>
    ${s?`<div class="row" style="gap:10px"><div class="grow"><label>Prénom</label><input name="firstName" autocomplete="given-name"></div><div class="grow"><label>Nom</label><input name="lastName" autocomplete="family-name"></div></div>`:''}
    <label>Adresse e-mail</label><input name="email" type="email" autocomplete="email" placeholder="exemple@email.com">
    ${s?`<label>Téléphone (facultatif)</label><input name="phone" type="tel" placeholder="+212 6 00 00 00 00">`:''}
    <label>Mot de passe</label><input name="password" type="password" autocomplete="${s?'new-password':'current-password'}" placeholder="8 caractères minimum">
    <button class="btn" type="submit">${s?'Créer mon compte':'Se connecter'}</button>
    ${s?'':`<p style="text-align:center;margin:12px 0 0"><button type="button" class="link" data-act="forgot">Mot de passe oublié ?</button></p>`}
  </form>`;
}
function phoneForm(s){
  if(auth.step===1){
    return `<form data-form="phone1" novalidate>
      ${s?`<div class="row" style="gap:10px"><div class="grow"><label>Prénom</label><input name="firstName" value="${esc(auth.firstName)}" autocomplete="given-name"></div><div class="grow"><label>Nom</label><input name="lastName" value="${esc(auth.lastName)}" autocomplete="family-name"></div></div>`:''}
      <label>Numéro de téléphone</label><input name="phone" type="tel" value="${esc(auth.phone)}" placeholder="+212 6 00 00 00 00" autocomplete="tel">

function finishBooking(){
  const d=MEDS[bk.idx];
  const doc={name:d.name,spec:d.spec,hop:d.hop,price:d.price};
  if(bk.editId){
    const a=data[me.id].appts.find(x=>x.id===bk.editId);
    a.date=bk.iso;a.doc=doc;a.motif=bk.motif;
    addNotif('confirm','Rendez-vous modifié',`${d.name} · ${fmtDT(bk.iso)}`);
    lastId=a.id;
  }else{
    const a={id:'MW-'+Date.now().toString(36).toUpperCase().slice(-8),doc,date:bk.iso,status:'confirmé',motif:bk.motif,price:d.price,who:bk.who,notes:bk.notes};
    data[me.id].appts.push(a);
    addNotif('confirm','Rendez-vous confirmé',`${d.name} · ${fmtDT(bk.iso)}`);
    lastId=a.id;
  }
  save(KEY_DATA,data);bk=null;view='done';render();

app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const {act,v}=el.dataset;
  if(act==='openDoc'){openDoc=+v;dayK=1;bk=null;view='doctor';render()}
  else if(act==='spec'){flt={q:'',spec:v};view='search';render()}
  else if(act==='back'){view=v;render()}
  else if(act==='day'){dayK=+v;render()}
  else if(act==='slot'){bk=bk&&bk.editId?{...bk,iso:v,step:3}:{idx:openDoc,iso:v,motif:'Consultation générale',notes:'',who:activeWho(),step:1,editId:null};view='book';render()}
  else if(act==='fav'){const s=new Set(me.favs||[]);s.has(openDoc)?s.delete(openDoc):s.add(openDoc);me.favs=[...s];save(KEY_USERS,users);render()}
  else if(act==='bstep'){bk.step=+v;render()}
  else if(act==='who'){bk.who=v;bk.step=3;render()}
  else if(act==='confirm'){finishBooking()}
  else if(act==='atab'){apptTab=v;cancelAsk=null;render()}
  else if(act==='askcancel'){cancelAsk=v;render()}
  else if(act==='cancelno'){cancelAsk=null;render()}
  else if(act==='cancel'){cancelAppt(v)}
  else if(act==='modify'){modifyAppt(v)}
  else if(act==='editprof'){profEdit=true;render()}
  else if(act==='cancelprof'){profEdit=false;render()}
  else if(act==='delfam'){me.family=(me.family||[]).filter(x=>x.id!==v);save(KEY_USERS,users);render()}
});

app.addEventListener('submit',e=>{
  const f=e.target,k=f.dataset.form,fd=new FormData(f);
  if(k==='search'){flt={q:fs(fd,'q'),spec:''};view='search';render()}
  else if(k==='filter'){flt={q:fs(fd,'q'),spec:flt.spec};render()}
  else if(k==='book1'){bk.motif=fs(fd,'motif');bk.notes=fs(fd,'notes');bk.step=2;render()}
  else if(k==='family'){
    const name=fs(fd,'name');
    if(!name)return toast('Indiquez le nom du proche.');
    me.family=[...(me.family||[]),{id:uid(),name,relation:fs(fd,'rel'),dob:fs(fd,'dob')}];profAdd=false;
    save(KEY_USERS,users);render();toast('Profil ajouté.');
  }
  else if(k==='profile'){
    const fn=fs(fd,'firstName'),ln=fs(fd,'lastName'),em=fs(fd,'email').toLowerCase(),ph=normPhone(fs(fd,'phone'));
    if(!fn||!ln)return toast('Prénom et nom sont obligatoires.');
    if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return toast('Adresse e-mail invalide.');
    if(ph&&!validPhone(ph))return toast('Numéro de téléphone invalide.');
    if(em&&users.some(u=>u.email===em&&u.id!==me.id))return toast('Cette adresse e-mail est déjà utilisée.');
    if(ph&&users.some(u=>u.phone===ph&&u.id!==me.id))return toast('Ce numéro est déjà utilisé.');
    Object.assign(me,{firstName:fn,lastName:ln,email:em,phone:ph,dob:fs(fd,'dob'),lang:fs(fd,'lang')});
    save(KEY_USERS,users);profEdit=false;render();toast('Profil mis à jour.');
  }
});

async function saveReceipt(name,pdf){
  const C=window.Capacitor;
  if(C&&C.isNativePlatform&&C.isNativePlatform()){
    const FS=C.Plugins.Filesystem,SH=C.Plugins.Share;
    const b64=pdf.output('datauristring').split(',')[1];
    const r=await FS.writeFile({path:name,data:b64,directory:'CACHE'});
    await SH.share({title:name,url:r.uri,dialogTitle:'Enregistrer ou partager le reçu'});
  }else{pdf.save(name)}
}
async function downloadReceipt(id){

  let y=84;
  const row=(label,value)=>{
    pdf.setFont('helvetica','bold');pdf.setFontSize(10);pdf.setTextColor(...G);pdf.text(label.toUpperCase(),20,y);
    pdf.setFont('helvetica','normal');pdf.setFontSize(12);pdf.setTextColor(...N);pdf.text(String(value),80,y);y+=12;
  };
  row('Patient',patientName(a));
  row('Médecin',a.doc.name);

  row('Lieu',a.doc.hop);
  row('Date',fmtDate(a.date));

  row('Motif',a.motif);
  row('Statut',STATUS[a.status]);
  y+=6;pdf.setDrawColor(...T);pdf.setLineWidth(0.6);pdf.line(20,y,190,y);y+=12;
  pdf.setFont('helvetica','bold');pdf.setFontSize(10);pdf.setTextColor(...G);pdf.text('TARIF DE CONSULTATION',20,y);
  pdf.setFontSize(14);pdf.setTextColor(...N);pdf.text(`${a.price} MAD`,190,y,{align:'right'});y+=16;

app.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target,fd=new FormData(f),kind=f.dataset.form;
  const str=k=>String(fd.get(k)||'').trim();
  if(kind==='email'){
    const email=str('email').toLowerCase(),pw=String(fd.get('password')||'');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return errEl('Adresse e-mail invalide.');
    if(pw.length<8)return errEl('Le mot de passe doit contenir au moins 8 caractères.');
    if(auth.mode==='signup'){
      const fn=str('firstName'),ln=str('lastName'),ph=normPhone(str('phone'));
      if(!fn||!ln)return errEl('Renseignez votre prénom et votre nom.');
      if(ph&&!validPhone(ph))return errEl('Numéro de téléphone invalide.');
      if(users.some(u=>u.email===email))return errEl('Un compte existe déjà avec cette adresse e-mail.');
      if(ph&&users.some(u=>u.phone===ph))return errEl('Ce numéro est déjà associé à un compte.');
      signIn(createAccount({firstName:fn,lastName:ln,email,phone:ph,password:pw}));
    }else{
      const u=users.find(x=>x.email===email&&x.password===pw);
      if(!u)return errEl('E-mail ou mot de passe incorrect.');
      signIn(u);
    }
  }
  else if(kind==='phone1'){
    const ph=normPhone(str('phone'));
    if(!validPhone(ph))return errEl('Numéro invalide. Exemple : +212 6 00 00 00 00');
    if(auth.mode==='signup'){
      auth.firstName=str('firstName');auth.lastName=str('lastName');
      if(!auth.firstName||!auth.lastName)return errEl('Renseignez votre prénom et votre nom.');
      if(users.some(u=>u.phone===ph))return errEl('Ce numéro est déjà associé à un compte.');
    }else if(!users.some(u=>u.phone===ph)){
      return errEl('Aucun compte avec ce numéro. Inscrivez-vous.');
    }
    auth.phone=ph;auth.demoCode=String(1000+Math.floor(Math.random()*9000));auth.step=2;
    render();toast(`Code envoyé (démo) : ${auth.demoCode}`);
  }
  else if(kind==='phone2'){
    if(str('code')!==auth.demoCode)return errEl('Code incorrect. Réessayez.');
    const u=auth.mode==='signup'
      ?createAccount({firstName:auth.firstName,lastName:auth.lastName,phone:auth.phone})
      :users.find(x=>x.phone===auth.phone);
    signIn(u);
  }
});

function docPic(d){
  if(d.photo)return d.photo;
  const f=d.f??FEM.includes(d.name.split(' ')[1]),h=(d.name.length*37)%4,bg=['#E4F1FA','#CDEBE6','#FBE3DB','#DCE6F5'][h],sk=['#F1C9A5','#D9A47C','#E8B98F','#C68B62'][(h+1)%4],hr=['#2B2B33','#4A3426','#1F1F24','#6B4A32'][h];
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><rect width="80" height="80" fill="${bg}"/>${f?`<path d="M22 44c-2-22 8-30 18-30s20 8 18 30c0 8-4 14-4 14H26s-4-6-4-14z" fill="${hr}"/>`:''}<path d="M10 80c0-16 12-22 30-22s30 6 30 22z" fill="#fff"/><path d="M32 58l8 12 8-12" fill="none" stroke="#1FB5A3" stroke-width="3" stroke-linecap="round"/><circle cx="40" cy="70" r="3" fill="#1FB5A3"/><rect x="35" y="48" width="10" height="12" fill="${sk}"/><ellipse cx="40" cy="36" rx="12" ry="14" fill="${sk}"/>${f?`<path d="M27 34c0-12 8-16 14-16s12 5 12 14c-6-2-16-6-26 2z" fill="${hr}"/>`:`<path d="M27 33c0-12 8-16 13-16s13 4 13 16c-4-6-8-8-13-8s-9 2-13 8z" fill="${hr}"/>`}</svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
const avA=p=>p.photo?`style="background-image:url('${p.photo}')"`:'',avT=p=>p.photo?'':esc(initials(p.name));
function setPhoto(u){const w=activeWho();if(w==='self')me.photo=u;else{const m=(me.family||[]).find(x=>x.id===w);if(m)m.photo=u}save(KEY_USERS,users);render();toast('Photo mise à jour.')}
app.addEventListener('change',e=>{const i=e.target;if(!i.matches||!i.matches('[data-photo]')||!i.files[0])return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),z=256,k=Math.min(im.width,im.height);c.width=c.height=z;c.getContext('2d').drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,z,z);setPhoto(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(i.files[0])});
app.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const {act,v}=el.dataset;if(act==='lang'){pref.lang=v;save(KEY_PREF,pref);applyPref();render()}else if(act==='rmphoto')setPhoto('')});
const favBlock=()=>{const f=(me.favs||[]).filter(i=>MEDS[i]);return f.length?`<h2 style="margin-top:6px">Mes favoris</h2>`+f.map(i=>{const d=MEDS[i];return `<div class="card" style="cursor:pointer" data-act="openDoc" data-v="${i}"><div class="row" style="align-items:center"><img class="dph" alt="" src="${docPic(d)}"><div class="grow"><strong>${esc(d.name)}</strong><p class="meta">${esc(d.spec)} · ★ ${d.rating}</p></div><button type="button" class="heart on" data-act="favt" data-v="${i}" aria-label="Favori">${svg('heart',20)}</button></div></div>`}).join(''):''};
app.addEventListener('click',e=>{const el=e.target.closest('[data-act="favt"]');if(!el)return;const i=+el.dataset.v,st=new Set(me.favs||[]),had=st.has(i);had?st.delete(i):st.add(i);me.favs=[...st];save(KEY_USERS,users);render();toast(had?'Retiré des favoris.':'Ajouté aux favoris.')});
if(me)ensureData(me.id);
render();
</script>
</body>
</html>
